<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ECG Lens Pro</title>
    <meta
      name="description"
      content="Web-based application for ECG signal analysis and visualization."
    />
    <meta name="theme-color" content="#0f172a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Base styles for the initial loading screen */
      :root {
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: #f8fafc;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      #initial-loader {
        text-align: center;
        transition: opacity 0.5s ease-out;
      }

      .pulse {
        width: 80px;
        height: 80px;
        background: #2563eb;
        border-radius: 50%;
        margin-bottom: 20px;
        animation: pulse-animation 1.5s infinite ease-out;
      }

      @keyframes pulse-animation {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 20px rgba(37, 99, 235, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
        }
      }

      .loading-text {
        color: #1e293b;
        font-weight: 600;
        font-size: 1.1rem;
        letter-spacing: -0.025em;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader">
        <div style="display: flex; justify-content: center">
          <div class="pulse"></div>
        </div>
        <div class="loading-text">Loading application...</div>
      </div>
    </div>

    <script type="module" src="./src/main.tsx"></script>

    <script>
      // Hide the loading screen after the page is fully loaded
      window.addEventListener("load", () => {
        const loader = document.getElementById("initial-loader");
        if (loader) loader.style.opacity = "0";
      });
    </script>
  </body>
</html>
